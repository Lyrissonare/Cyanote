# Render blueprint — 一键创建 Cyanote Web 服务
# 在 Render Dashboard → New → Blueprint 中选择本仓库即可
services:
  - type: web
    name: cyanote
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: CYANOTE_TOKEN
        generateValue: true # 在 Render 环境变量页查看管理台令牌
      - key: SEED_DEMO
        value: "1" # 首次启动自动写入演示文章；设为 0 关闭
